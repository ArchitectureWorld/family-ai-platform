name: HarmonyOS Core CI

on:
  pull_request:
    paths:
      - "clients/harmonyos/**"
      - "scripts/verify-harmonyos-core.sh"
      - ".github/workflows/harmonyos-core-ci.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "clients/harmonyos/**"
      - "scripts/verify-harmonyos-core.sh"
      - ".github/workflows/harmonyos-core-ci.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: harmonyos-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify HarmonyOS Mobile Entry core
        run: bash ./scripts/verify-harmonyos-core.sh
