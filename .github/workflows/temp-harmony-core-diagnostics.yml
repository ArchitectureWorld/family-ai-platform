name: Temporary HarmonyOS Core Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/temp-harmony-core-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Capture complete verification output
        run: |
          set +e
          bash ./scripts/verify-harmonyos-core.sh > harmony-core.log 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> harmony-core.log
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: harmony-core-diagnostic
          path: harmony-core.log
          if-no-files-found: error
          retention-days: 1
