name: Temporary Mobile Platform Apply

on:
  pull_request:
    paths:
      - ".github/workflows/temp-mobile-platform-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Apply exact platform-neutral patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          contract = Path("packages/contracts/src/mobileEntry.ts")
          text = contract.read_text(encoding="utf-8")
          old = '    platform: z.literal("ios"),'
          new = '    platform: z.enum(["ios", "harmonyos"]),'
          if text.count(old) != 1:
              raise SystemExit("unexpected Mobile Entry platform source")
          contract.write_text(text.replace(old, new), encoding="utf-8")

          gateway = Path("apps/gateway/src/mobilePairing.ts")
          text = gateway.read_text(encoding="utf-8")
          old = '''         VALUES(?, ?, 'mobile', 'ios', 'active', ?, ?, ?, NULL, ?, ?, ?, ?, ?)`
                ).run(
                  deviceRef,
                  input.device.displayName,
                  credentialHash,'''
          new = '''         VALUES(?, ?, ?, ?, 'active', ?, ?, ?, NULL, ?, ?, ?, ?, ?)`
                ).run(
                  deviceRef,
                  input.device.displayName,
                  input.device.terminalType,
                  input.device.platform,
                  credentialHash,'''
          if text.count(old) != 1:
              raise SystemExit("unexpected Gateway mobile persistence source")
          gateway.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Verify focused Contract and Gateway behavior
        run: |
          set -euo pipefail
          npm run test -w @family-ai/contracts -- mobileEntry.test.ts mobileEntryPlatform.test.ts
          npm run test -w @family-ai/gateway -- mobileHarmonyPairing.test.ts mobileRoutes.test.ts
      - name: Remove temporary workflows and push implementation
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-mobile-platform-apply.yml
          git rm .github/workflows/temp-mobile-source-export.yml
          git add packages/contracts/src/mobileEntry.ts apps/gateway/src/mobilePairing.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(contracts): admit HarmonyOS mobile devices"
          git push origin "HEAD:${HEAD_BRANCH}"
