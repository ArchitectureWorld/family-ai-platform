<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Family AI 家庭管理</title>
    <link rel="stylesheet" href="/admin/assets/admin.css">
  </head>
  <body>
    <main class="admin-shell" aria-live="polite">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">F</span>
        <div>
          <p class="eyebrow">Family AI</p>
          <h1>家庭管理</h1>
        </div>
      </header>

      <section class="state-card" data-state="initializing">
        <p class="eyebrow">正在准备</p>
        <h2>连接你的家庭空间</h2>
        <p>正在验证管理员入口与家庭状态，请稍候。</p>
        <div class="progress" role="progressbar" aria-label="正在加载"></div>
      </section>

      <section class="state-card" data-state="create-family" hidden>
        <p class="eyebrow">首次使用</p>
        <h2>创建家庭</h2>
        <p>设置家庭、管理员和这台管理设备后，就能邀请成员进入个人工作台。</p>
        <div id="family-setup-root"></div>
      </section>

      <section class="state-card" data-state="management" hidden>
        <nav class="admin-page-navigation" aria-label="管理员页面">
          <button
            class="admin-page-button is-selected"
            data-admin-page="members"
            type="button"
            aria-selected="true"
          >
            成员与 Agent 配置
          </button>
          <button
            class="admin-page-button"
            data-admin-page="workspace"
            type="button"
            aria-selected="false"
          >
            系统工作台
          </button>
        </nav>
        <div id="admin-members-page">
          <p class="eyebrow">家庭控制台</p>
          <h2>成员与 Agent 配置</h2>
          <div id="family-summary"></div>
          <div id="member-management-root"></div>
        </div>
        <div id="admin-workspace-page" hidden>
          <section
            class="agent-monitor compact"
            id="admin-agent-monitor"
            data-agent-monitor
            aria-label="全部 Agent 运行状态"
          ></section>
          <section
            class="admin-agent-workspace"
            id="admin-agent-workspace"
            data-agent-workspace
            aria-label="Jarvis 与 Codex 系统工作台"
          ></section>
        </div>
      </section>

      <section class="state-card recovery" data-state="recovery-required" hidden>
        <p class="eyebrow">需要管理员入口</p>
        <h2>无法验证管理员身份</h2>
        <p>输入五分钟有效的一次性管理员激活码，验证后即可管理家庭成员。</p>
        <form class="activation-form" id="admin-activation-form">
          <label class="field" for="admin-activation-code">
            <span>管理员激活码</span>
            <input
              id="admin-activation-code"
              name="activationCode"
              autocomplete="one-time-code"
              autocapitalize="characters"
              inputmode="text"
              maxlength="11"
              pattern="[A-HJ-NP-Z2-9]{5}-[A-HJ-NP-Z2-9]{5}"
              placeholder="XXXXX-XXXXX"
              spellcheck="false"
              required
            >
          </label>
          <button
            class="primary-button"
            id="admin-activation-submit"
            type="submit"
          >
            激活管理员设备
          </button>
          <p
            class="form-message"
            id="admin-activation-message"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </section>
    </main>
    <script type="module" src="/admin/assets/admin.js"></script>
  </body>
</html>
